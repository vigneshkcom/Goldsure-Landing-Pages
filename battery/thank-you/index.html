html{-webkit-text-size-adjust:100%}

h1,p{margin:0}
.bar{height:64px;display:flex;align-items:center;justify-content:center;padding:0 20px}
.bar img{width:112px;height:28px;object-fit:contain;display:block}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px 56px}
.card{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.check{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#DDB95E 0%,#C9A84C 100%);box-shadow:inset 0 1px 0 #FFFFFF73,0 16px 36px #A8892F59}
h1{font-family:"Clash Display",system-ui,sans-serif;font-weight:600;font-size:32px;line-height:36px;letter-spacing:-.02em;text-wrap:balance}
.lead{font-size:17px;line-height:26px;color:#FFFFFFD9;text-wrap:pretty;max-width:440px}
.next{width:100%;margin-top:8px;padding:22px 24px;border-radius:18px;background:#FFFFFF14;border:1px solid #FFFFFF2E;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-align:left;display:flex;flex-direction:column;gap:12px}
.next small{color:#C9A84C;font-weight:600;font-size:12px;line-height:16px;letter-spacing:.14em;text-transform:uppercase}
.next ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.next li{font-weight:500;font-size:16px;line-height:22px;color:#fff}
@media (min-width:768px){
  .bar{height:84px}.bar img{width:160px;height:40px}
  h1{font-size:44px;line-height:48px}
  .lead{font-size:19px;line-height:29px}
  .card{gap:24px}
  .next{padding:26px 28px}
  .next li{font-size:17px;line-height:24px}
